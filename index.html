<!doctype html>
<!--
  index.html
  ------------------------------------------------------------------
  Punto de entrada HTML de la aplicación. Vite inyecta aquí el bundle
  final de JS/CSS al hacer "npm run build". El <div id="app"> es donde
  Vue "monta" toda la aplicación (ver codigo/principal.js).
  ------------------------------------------------------------------
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manuel Guzmán — Informática Empresarial, desarrollo de software y sistemas. Portafolio de proyectos académicos."
    />
    <title>Manuel Guzmán — Informática Empresarial &amp; Sistemas</title>

    <!-- Fuentes desde Google Fonts: Space Grotesk (títulos), Inter (texto), JetBrains Mono (datos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink text-paper antialiased">
    <!-- Aquí Vue renderiza toda la app (ver codigo/Aplicacion.vue) -->
    <div id="app"></div>

    <!-- Punto de entrada de JavaScript. Nota la ruta: /codigo/principal.js -->
    <script type="module" src="/codigo/principal.js"></script>
  </body>
</html>
